<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm clicker⏰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
            background-color: #F8F9FA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .score-label {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            margin-top: 40px;
        }

        .click-btn {
            width: 200px;
            height: 200px;
            border-radius: 100px;
            border: none;
            background-color: #cfe6ff;
            background-image: url('picture1.png');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            margin: 10px auto;
            display: block;
            transition: background-color 0.2s;
        }

        .click-btn:hover {
            background-color: #E8E6FF;
        }

        .click-btn:active {
            transform: scale(0.98);
        }

        .shop-label {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
            margin-bottom: 5px;
        }

        .shop-btn {
            width: 180px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background-color: #abeaff;
            color: #333;
            font-family: "Lucida Sans Unicode", sans-serif;
            font-size: 16px;
            cursor: pointer;
            margin: 10px auto;
            display: block;
            transition: all 0.2s;
        }

        .shop-btn:hover:not(:disabled) {
            background-color: #5A52E0;
            color: white;
        }

        .shop-btn:disabled {
            background-color: #d0d0d0;
            color: #888;
            cursor: not-allowed;
        }

        .skin-btn {
            width: 180px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background-color: #72b8e0;
            color: #333;
            font-family: "Lucida Sans Unicode", sans-serif;
            font-size: 16px;
            cursor: pointer;
            margin: 10px auto;
            display: block;
            transition: all 0.2s;
        }

        .skin-btn:hover:not(:disabled) {
            background-color: #5A52E0;
            color: white;
        }

        .skin-btn:disabled {
            background-color: #d0d0d0;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="score-label" id="scoreLabel">⏰ 0</div>
        
        <button class="click-btn" id="clickBtn" onclick="on_click()"></button>

        <div class="shop-label">Магазин улучшений</div>
        
        <button class="shop-btn" id="shopBtn" onclick="buy()">КУПИТЬ (10)</button>
        
        <button class="skin-btn" id="skinBtn" onclick="buy2()">КУПИТЬ СКИН (10)</button>
    </div>

    <script>
        // Переменные игры
        let score = 0;
        let clickPower = 1;
        let price = 10;
        let skinPrice1 = 10;
        let skinPrice2 = 30;
        let skinPrice3 = 50;
        
        let skin1 = false;
        let skin2 = false;
        let skin3 = false;
        let skin4 = false;
        
        let currentSkin = 0;

        const scoreLabel = document.getElementById('scoreLabel');
        const clickBtn = document.getElementById('clickBtn');
        const shopBtn = document.getElementById('shopBtn');
        const skinBtn = document.getElementById('skinBtn');

        function on_click() {
            score += clickPower;
            scoreLabel.textContent = `⏰ ${score}`;
            update();
        }

        function buy() {
            if (score >= price) {
                score -= price;
                clickPower += 1;
                price = Math.floor(price * 1.5);
                scoreLabel.textContent = `⏰ ${score}`;
                update();
            }
        }

        function buy2() {
            if (score >= skinPrice1 && !skin1) {
                score -= skinPrice1;
                skin1 = true;
                currentSkin = 1;
                changeSkin('pic2.png');
                skinBtn.textContent = `КУПИТЬ СКИН (${skinPrice2})`;
            } else if (score >= skinPrice2 && !skin2) {
                score -= skinPrice2;
                skin2 = true;
                currentSkin = 2;
                changeSkin('pic3.png');
                skinBtn.textContent = `КУПИТЬ СКИН (${skinPrice3})`;
            } else if (score >= skinPrice3 && !skin3) {
                score -= skinPrice3;
                skin3 = true;
                currentSkin = 3;
                changeSkin('pic4.png');
                skinBtn.style.display = 'none';
            }
            scoreLabel.textContent = `⏰ ${score}`;
            update();
        }

        function changeSkin(imageFile) {
            clickBtn.style.backgroundImage = `url('${imageFile}')`;
        }

        function update() {
            if (score >= price) {
                shopBtn.disabled = false;
                shopBtn.textContent = `КУПИТЬ (${price})`;
            } else {
                shopBtn.disabled = true;
                shopBtn.textContent = `НУЖНО (${price})`;
            }

            if (!skin1) {
                if (score >= skinPrice1) {
                    skinBtn.disabled = false;
                    skinBtn.textContent = `КУПИТЬ СКИН (${skinPrice1})`;
                } else {
                    skinBtn.disabled = true;
                    skinBtn.textContent = `НУЖНО (${skinPrice1})`;
                }
            } else if (!skin2) {
                if (score >= skinPrice2) {
                    skinBtn.disabled = false;
                    skinBtn.textContent = `КУПИТЬ СКИН (${skinPrice2})`;
                } else {
                    skinBtn.disabled = true;
                    skinBtn.textContent = `НУЖНО (${skinPrice2})`;
                }
            } else if (!skin3) {
                if (score >= skinPrice3) {
                    skinBtn.disabled = false;
                    skinBtn.textContent = `КУПИТЬ СКИН (${skinPrice3})`;
                } else {
                    skinBtn.disabled = true;
                    skinBtn.textContent = `НУЖНО (${skinPrice3})`;
                }
            }
        }

        update();
    </script>
</body>
</html>
